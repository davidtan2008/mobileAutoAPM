name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python 工具（零依赖，最快，先跑） ──────────────────────
  python:
    name: Python 工具与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 全部工具只用标准库，无需 pip install。
      # 关键：CI **调用与本地相同的 make 目标**，保证「本地能跑、CI 也能跑」，
      # 不会出现两套命令各自漂移。
      - name: 语法检查
        run: make lint

      - name: 运行测试
        run: make test-py

      - name: AI 友好度门禁（不得退化）
        run: make gate

      - name: 跨 agent 产物必须与源头一致
        run: make verify-portable

      # 图表同理：改了 SVG 忘记重生成 PNG，读者看到的会是过期结论 ——
      # 漂移的图比没有图更糟。
      - name: 架构图 PNG 必须与 SVG 一致
        run: |
          sudo apt-get install -y -qq librsvg2-bin
          make verify-diagrams

  # ── React Native SDK ────────────────────────────────────
  rn-sdk:
    name: rn-apm（React Native SDK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖
        working-directory: rn-apm
        run: npm ci --no-audit --no-fund
      - name: 构建与测试
        working-directory: rn-apm
        run: npm test

  # ── iOS SDK ────────────────────────────────────────────
  ios-sdk:
    name: ios-apm（iOS 原生 SDK）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: 构建与测试
        working-directory: ios-apm
        run: swift test
