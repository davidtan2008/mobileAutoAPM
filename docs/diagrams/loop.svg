<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#484f58"/>
    </marker>
    <marker id="a-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#f85149"/>
    </marker>
    <marker id="a-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#0d1117"/>

  <text x="600" y="44" font-family="PingFang SC,sans-serif" font-size="24" font-weight="600"
        fill="#e6edf3" text-anchor="middle">自主闭环 · 数据流</text>
  <text x="600" y="70" font-family="PingFang SC,sans-serif" font-size="13" fill="#8b949e"
        text-anchor="middle">每一环都必须可验证 —— 否则闭环断裂，Agent 只能靠猜</text>

  <!-- ═══ 五个阶段 ═══ -->
  <g font-family="PingFang SC,sans-serif">
    <!-- 1 发现 -->
    <rect x="54" y="106" width="196" height="96" rx="10" fill="#12233c" stroke="#388bfd"/>
    <text x="152" y="134" font-size="15" font-weight="600" fill="#79c0ff" text-anchor="middle">① 发现</text>
    <text x="152" y="158" font-size="11" fill="#c9d1d9" text-anchor="middle">采集数据 → 对比基线</text>
    <text x="152" y="176" font-size="11" fill="#c9d1d9" text-anchor="middle">→ 判定劣化</text>
    <text x="152" y="195" font-size="10" fill="#6e7681" text-anchor="middle">apm-profiler 子 Agent</text>

    <!-- 2 定位 -->
    <rect x="278" y="106" width="196" height="96" rx="10" fill="#12233c" stroke="#388bfd"/>
    <text x="376" y="134" font-size="15" font-weight="600" fill="#79c0ff" text-anchor="middle">② 定位</text>
    <text x="376" y="158" font-size="11" fill="#c9d1d9" text-anchor="middle">根因必须指到</text>
    <text x="376" y="176" font-size="11" fill="#c9d1d9" text-anchor="middle">具体代码位置</text>
    <text x="376" y="195" font-size="10" fill="#f85149" text-anchor="middle">猜出来的根因不算根因</text>

    <!-- 3 修复 -->
    <rect x="502" y="106" width="196" height="96" rx="10" fill="#12233c" stroke="#388bfd"/>
    <text x="600" y="134" font-size="15" font-weight="600" fill="#79c0ff" text-anchor="middle">③ 修复</text>
    <text x="600" y="158" font-size="11" fill="#c9d1d9" text-anchor="middle">单变量 · 一次只改一处</text>
    <text x="600" y="176" font-size="11" fill="#c9d1d9" text-anchor="middle">删 → 延迟 → 并发</text>
    <text x="600" y="195" font-size="10" fill="#6e7681" text-anchor="middle">删比优化更有效</text>

    <!-- 4 验证（强调） -->
    <rect x="726" y="100" width="204" height="108" rx="10" fill="#2d1f0f" stroke="#d29922" stroke-width="2"/>
    <text x="828" y="130" font-size="15" font-weight="600" fill="#e3b341" text-anchor="middle">④ 验证 ★</text>
    <text x="828" y="154" font-size="11" fill="#c9d1d9" text-anchor="middle">同口径复测</text>
    <text x="828" y="172" font-size="11" fill="#c9d1d9" text-anchor="middle">+ 置换检验</text>
    <text x="828" y="190" font-size="11" fill="#c9d1d9" text-anchor="middle">+ 功能回归</text>
    <text x="828" y="203" font-size="10" fill="#f85149" text-anchor="middle">最容易糊弄的一步</text>

    <!-- 5 防劣化 -->
    <rect x="954" y="106" width="192" height="96" rx="10" fill="#12233c" stroke="#388bfd"/>
    <text x="1050" y="134" font-size="15" font-weight="600" fill="#79c0ff" text-anchor="middle">⑤ 防劣化</text>
    <text x="1050" y="158" font-size="11" fill="#c9d1d9" text-anchor="middle">写入基线</text>
    <text x="1050" y="176" font-size="11" fill="#c9d1d9" text-anchor="middle">→ CI 门禁</text>
    <text x="1050" y="195" font-size="10" fill="#6e7681" text-anchor="middle">不做就会被时间侵蚀</text>
  </g>

  <!-- 阶段间箭头 -->
  <line x1="250" y1="154" x2="276" y2="154" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="474" y1="154" x2="500" y2="154" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="698" y1="154" x2="724" y2="154" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="930" y1="154" x2="952" y2="154" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ═══ 产物带 ═══ -->
  <text x="54" y="248" font-family="PingFang SC,sans-serif" font-size="12" fill="#8b949e">
    每步的产物（可追溯是硬要求）：
  </text>

  <g font-family="PingFang SC,sans-serif" font-size="10.5">
    <rect x="54" y="262" width="196" height="76" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="152" y="282" fill="#8b949e" text-anchor="middle">.apm/runs/&lt;时间&gt;/</text>
    <text x="152" y="300" fill="#6e7681" text-anchor="middle">raw/ 原始 trace</text>
    <text x="152" y="316" fill="#6e7681" text-anchor="middle">metrics.json 规范化指标</text>
    <text x="152" y="332" fill="#58a6ff" text-anchor="middle">meta.json 含 commit/设备</text>

    <rect x="278" y="262" width="196" height="76" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="282" fill="#8b949e" text-anchor="middle">.apm/issues/</text>
    <text x="376" y="300" fill="#6e7681" text-anchor="middle">ISSUE-NNN.json</text>
    <text x="376" y="316" fill="#6e7681" text-anchor="middle">证据 + 置信度</text>
    <text x="376" y="332" fill="#58a6ff" text-anchor="middle">按影响面排序</text>

    <rect x="502" y="262" width="196" height="76" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="600" y="282" fill="#8b949e" text-anchor="middle">代码改动</text>
    <text x="600" y="300" fill="#6e7681" text-anchor="middle">单变量补丁</text>
    <text x="600" y="316" fill="#6e7681" text-anchor="middle">+ 为什么这样改</text>
    <text x="600" y="332" fill="#58a6ff" text-anchor="middle">依据是哪条方法论</text>

    <rect x="726" y="262" width="204" height="76" rx="7" fill="#161b22" stroke="#d29922"/>
    <text x="828" y="282" fill="#e3b341" text-anchor="middle">验证报告</text>
    <text x="828" y="300" fill="#6e7681" text-anchor="middle">命令 + 设备 + 样本量 + 显著性</text>
    <text x="828" y="316" fill="#6e7681" text-anchor="middle">四项缺一不可</text>
    <text x="828" y="332" fill="#f85149" text-anchor="middle">幅度在噪声内 → 如实说无改善</text>

    <rect x="954" y="262" width="192" height="76" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="1050" y="282" fill="#8b949e" text-anchor="middle">.apm/baseline/</text>
    <text x="1050" y="300" fill="#6e7681" text-anchor="middle">更新后的基线</text>
    <text x="1050" y="316" fill="#6e7681" text-anchor="middle">必须入库</text>
    <text x="1050" y="332" fill="#58a6ff" text-anchor="middle">否则换机即失效</text>
  </g>

  <!-- ═══ 回归回路 ═══ -->
  <path d="M 828 340 L 828 396 L 152 396 L 152 358"
        fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6 4"
        marker-end="url(#a-red)"/>
  <rect x="380" y="380" width="252" height="32" rx="6" fill="#1c1a12" stroke="#f85149"/>
  <text x="506" y="401" font-family="PingFang SC,sans-serif" font-size="11.5" fill="#f85149"
        text-anchor="middle">验证失败 / 幅度不显著 → 重新定位</text>

  <!-- ═══ 铁律带 ═══ -->
  <rect x="54" y="440" width="1092" height="1" fill="#21262d"/>

  <text x="600" y="474" font-family="PingFang SC,sans-serif" font-size="14" font-weight="600"
        fill="#e6edf3" text-anchor="middle">贯穿全程的五条铁律</text>
  <text x="600" y="496" font-family="PingFang SC,sans-serif" font-size="11.5" fill="#8b949e"
        text-anchor="middle">违反任何一条，产出即作废</text>

  <g font-family="PingFang SC,sans-serif">
    <rect x="54" y="514" width="204" height="72" rx="8" fill="#1c1a12" stroke="#d29922"/>
    <text x="156" y="540" font-size="12.5" font-weight="600" fill="#e3b341" text-anchor="middle">无基线不优化</text>
    <text x="156" y="562" font-size="10.5" fill="#8b949e" text-anchor="middle">没有可比基线之前的</text>
    <text x="156" y="578" font-size="10.5" fill="#8b949e" text-anchor="middle">「优化」都是盲改</text>

    <rect x="270" y="514" width="204" height="72" rx="8" fill="#1c1a12" stroke="#d29922"/>
    <text x="372" y="540" font-size="12.5" font-weight="600" fill="#e3b341" text-anchor="middle">单变量</text>
    <text x="372" y="562" font-size="10.5" fill="#8b949e" text-anchor="middle">一次只改一处</text>
    <text x="372" y="578" font-size="10.5" fill="#8b949e" text-anchor="middle">否则无法归因</text>

    <rect x="486" y="514" width="204" height="72" rx="8" fill="#1c1a12" stroke="#d29922"/>
    <text x="588" y="540" font-size="12.5" font-weight="600" fill="#e3b341" text-anchor="middle">必须复测</text>
    <text x="588" y="562" font-size="10.5" fill="#8b949e" text-anchor="middle">同设备 · 同构建类型</text>
    <text x="588" y="578" font-size="10.5" fill="#8b949e" text-anchor="middle">同命令 —— 口径必须先一致</text>

    <rect x="702" y="514" width="204" height="72" rx="8" fill="#2a1214" stroke="#f85149"/>
    <text x="804" y="540" font-size="12.5" font-weight="600" fill="#f85149" text-anchor="middle">绝不伪造</text>
    <text x="804" y="562" font-size="10.5" fill="#8b949e" text-anchor="middle">测不出来就说测不出来</text>
    <text x="804" y="578" font-size="10.5" fill="#8b949e" text-anchor="middle">这一条专门针对 LLM</text>

    <rect x="918" y="514" width="228" height="72" rx="8" fill="#1c1a12" stroke="#d29922"/>
    <text x="1032" y="540" font-size="12.5" font-weight="600" fill="#e3b341" text-anchor="middle">结论带来源</text>
    <text x="1032" y="562" font-size="10.5" fill="#8b949e" text-anchor="middle">每个数字可追溯到</text>
    <text x="1032" y="578" font-size="10.5" fill="#8b949e" text-anchor="middle">命令 · 设备 · commit</text>
  </g>

  <!-- 为什么第 4 条特别 -->
  <rect x="150" y="612" width="900" height="62" rx="8" fill="#161b22" stroke="#f85149"/>
  <text x="600" y="636" font-family="PingFang SC,sans-serif" font-size="12" fill="#f85149"
        text-anchor="middle" font-weight="600">为什么「绝不伪造」是单独一条铁律</text>
  <text x="600" y="658" font-family="PingFang SC,sans-serif" font-size="11" fill="#c9d1d9"
        text-anchor="middle">LLM 做性能优化最常见的失败模式，是编一个看起来合理的数字，然后基于它改一堆代码。</text>
  <text x="600" y="672" font-family="PingFang SC,sans-serif" font-size="11" fill="#8b949e"
        text-anchor="middle">这比不优化更糟 —— 没有真实基线时，改得越多问题越难收敛。</text>
</svg>
