<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0b1020" opacity="1.0"/><rect x="0" y="0" width="18" height="1080" rx="0" fill="#ffc857" opacity="1.0"/><text x="96" y="108" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#9aa8c7" text-anchor="start" opacity="1.0">06 · 边界与下一步</text><text x="96" y="186" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" fill="#e8edf7" text-anchor="start" opacity="1.0">成功案例必须连同它的边界一起发布</text><rect x="96" y="214" width="220" height="6" rx="3" fill="#ffc857" opacity="1.0"/><text x="96" y="1024" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#9aa8c7" text-anchor="start" opacity="1.0">mobileAutoAPM · 所有数字来自本次真实命令输出</text><text x="1824" y="1024" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#9aa8c7" text-anchor="end" opacity="1.0">6/6</text><rect x="96" y="292" width="1728" height="364" rx="20" fill="#141b2d" opacity="1.0" stroke="#26314d" stroke-width="2"/><text x="128" y="348" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#ffc857" text-anchor="start" opacity="1.0">这是确定性功能闭环 —— 用红/绿测试验证，不用模拟器性能数字冒充真机结论。</text><text x="128" y="392" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#ffc857" text-anchor="start" opacity="1.0"></text><text x="128" y="436" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#ffc857" text-anchor="start" opacity="1.0">本次没有宣称：</text><text x="128" y="480" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#ffc857" text-anchor="start" opacity="1.0">  · 真机 UI 自动化已跑通（免费 provisioning 达到 App 安装上限）</text><text x="128" y="524" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#ffc857" text-anchor="start" opacity="1.0">  · 全部 UI 测试通过（另有 open：home-module-simultaneous 不可点击）</text><text x="128" y="568" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#ffc857" text-anchor="start" opacity="1.0">  · 导出按钮同页刷新已修复（独立后续项）</text><text x="128" y="612" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#ffc857" text-anchor="start" opacity="1.0">  · T1 冷启动 200ms 可达（已被最小 control 实测地板拦截）</text><text x="96" y="880" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">下一步：按本脚本人工审阅录制；UI 可点击性问题继续作为独立闭环处理。</text></svg>
