<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0b1020" opacity="1.0"/><rect x="0" y="0" width="18" height="1080" rx="0" fill="#ff6b6b" opacity="1.0"/><text x="96" y="108" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#9aa8c7" text-anchor="start" opacity="1.0">03 · 定位：UI 成功，持久化静默丢弃</text><text x="96" y="186" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" fill="#e8edf7" text-anchor="start" opacity="1.0">一个 guard 把「已结束」变成了「不可回填」</text><rect x="96" y="214" width="220" height="6" rx="3" fill="#ff6b6b" opacity="1.0"/><text x="96" y="1024" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#9aa8c7" text-anchor="start" opacity="1.0">mobileAutoAPM · 所有数字来自本次真实命令输出</text><text x="1824" y="1024" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#9aa8c7" text-anchor="end" opacity="1.0">3/5</text><rect x="96" y="292" width="1728" height="392" rx="20" fill="#141b2d" opacity="1.0" stroke="#26314d" stroke-width="2"/><text x="128" y="348" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">TaskDetailView.handleTranslated</text><text x="128" y="390" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">  current.entries[index].translatedText = text   ← 内存立刻更新，UI 显示成功</text><text x="128" y="432" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">  await taskStore.append(...)                    ← 回填持久化</text><text x="128" y="474" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0"></text><text x="128" y="516" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">InMemoryTaskStore.append   guard task.status != .ended else { return }</text><text x="128" y="558" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">SwiftDataTaskStore.append  guard entity.statusRaw != ended else { return }</text><text x="128" y="600" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0"></text><text x="128" y="642" font-family="SF Mono, Menlo, Consolas, monospace" font-size="26" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">详情页只能进入 ended 任务  →  append 必然被丢弃，且无任何错误</text><text x="96" y="830" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="500" fill="#9aa8c7" text-anchor="start" opacity="1.0">同源对照：saveSummary 没有这个 guard，所以「总结」能存、「翻译」存不了 —— 这就是它长期没被发现的原因。</text></svg>
