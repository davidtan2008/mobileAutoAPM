<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0b1020" opacity="1.0"/><rect x="0" y="0" width="18" height="1080" rx="0" fill="#3ddc97" opacity="1.0"/><text x="96" y="108" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#9aa8c7" text-anchor="start" opacity="1.0">04 · 修复：只改一个变量</text><text x="96" y="186" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="800" fill="#e8edf7" text-anchor="start" opacity="1.0">新增专用译文回填通道，不动其他路径</text><rect x="96" y="214" width="220" height="6" rx="3" fill="#3ddc97" opacity="1.0"/><text x="96" y="1024" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#9aa8c7" text-anchor="start" opacity="1.0">mobileAutoAPM · 所有数字来自本次真实命令输出</text><text x="1824" y="1024" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500" fill="#9aa8c7" text-anchor="end" opacity="1.0">4/5</text><rect x="96" y="292" width="1728" height="308" rx="20" fill="#141b2d" opacity="1.0" stroke="#26314d" stroke-width="2"/><text x="128" y="348" font-family="SF Mono, Menlo, Consolas, monospace" font-size="27" font-weight="500" fill="#3ddc97" text-anchor="start" opacity="1.0">protocol TaskStore {</text><text x="128" y="390" font-family="SF Mono, Menlo, Consolas, monospace" font-size="27" font-weight="500" fill="#3ddc97" text-anchor="start" opacity="1.0">    func updateTranslations(taskID: UUID, entries: [TranscriptEntry]) async</text><text x="128" y="432" font-family="SF Mono, Menlo, Consolas, monospace" font-size="27" font-weight="500" fill="#3ddc97" text-anchor="start" opacity="1.0">}</text><text x="128" y="474" font-family="SF Mono, Menlo, Consolas, monospace" font-size="27" font-weight="500" fill="#3ddc97" text-anchor="start" opacity="1.0"></text><text x="128" y="516" font-family="SF Mono, Menlo, Consolas, monospace" font-size="27" font-weight="500" fill="#3ddc97" text-anchor="start" opacity="1.0">只更新已有 entry 的 translatedText；允许作用于 ended 任务。</text><text x="128" y="558" font-family="SF Mono, Menlo, Consolas, monospace" font-size="27" font-weight="500" fill="#3ddc97" text-anchor="start" opacity="1.0">普通 append 继续保持 ended guard —— 没有放宽 transcript 写入规则。</text><rect x="96" y="680" width="12" height="12" rx="6" fill="#6ba8ff" opacity="1.0"/><text x="128" y="700" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">变量 = 持久化边界（新增一个方法，语义明确）</text><rect x="96" y="734" width="12" height="12" rx="6" fill="#6ba8ff" opacity="1.0"/><text x="128" y="754" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">没有同时修改导出按钮、翻译队列或 UI 布局</text><rect x="96" y="788" width="12" height="12" rx="6" fill="#6ba8ff" opacity="1.0"/><text x="128" y="808" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="500" fill="#e8edf7" text-anchor="start" opacity="1.0">InMemory / SwiftData / Deferred 三个实现同步同一语义</text></svg>
